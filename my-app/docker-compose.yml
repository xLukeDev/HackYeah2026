services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - BETTER_AUTH_SECRET=change-me-in-production-use-random-32chars
      - BETTER_AUTH_URL=http://localhost:3000
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
